name: Update Strava feed

on:
  push:
    paths:
      - '.github/workflows/strava.yml'
      - 'scripts/fetch_strava.py'
      - 'assets/strava_overrides.json'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strava-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Strava activities
        id: fetch
        continue-on-error: true
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/fetch_strava.py

      - name: Commit updated JSON
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/strava.json _private/strava_token.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Strava feed"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push; then
              exit 0
            fi
            sleep 5
          done
          echo "Unable to push Strava feed after three attempts."
          exit 1

      - name: Report Strava fetch failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1
