name: Publish TimeKeeper

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Feed commits use GITHUB_TOKEN, whose pushes do not trigger other workflows.
  workflow_run:
    workflows: [Update Strava feed]
    types: [completed]
    branches: [main]
  # Usage feeds intentionally use [skip ci]. Publish their newest snapshots too.
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Frequent usage updates must not cancel a deployment waiting in the Pages queue.
concurrency:
  group: timekeeper-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare public app files
        run: node scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site
      - uses: actions/deploy-pages@v4
        id: deployment
